[package]
name = "burumy_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.5"
mime = "0.3.18"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
# Same crate matrix-sdk is built on; only for the CollectStrategy type.
matrix-sdk-base = { version = "0.19.1", default-features = false, features = ["e2e-encryption"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.2"

# Phones and computers: encrypted SQLite store.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "automatic-room-key-forwarding", "rustls-aws-lc-rs", "experimental-send-custom-to-device"] }
# Link previews: same HTTP client matrix-sdk already uses (no new code pulled in).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Web: encrypted IndexedDB store in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "indexeddb", "js", "automatic-room-key-forwarding", "experimental-send-custom-to-device"] }

[dev-dependencies]
futures-util = "0.3.34"
hmac = "0.12"
tokio = { version = "1.54.1", features = ["full"] }
