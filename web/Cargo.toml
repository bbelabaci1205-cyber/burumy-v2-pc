[package]
name = "burumy_web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
burumy_engine = { path = "../engine" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
gloo-timers = { version = "0.4.1", features = ["futures"] }
web-sys = { version = "0.3.107", features = ["console"] }
